services:
  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: MedGPT_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./Client/.env
    depends_on:
      - user-service
    volumes:
      - ./Client/src:/app/src
      - ./Client/public:/app/public

  user-service:
    build:
      context: ./Server/user_service
      dockerfile: Dockerfile
    container_name: MedGPT_user_service
    ports:
      - "3000:3000"
    env_file:
      - ./Server/user_service/.env
    environment:
      - DATABASE_URL=postgresql://postgres:Saha%4006122004@db:5432/MedGPT_DB
      - RAG_SERVICE_URL=http://rag-service:8000
      - AGENT_SERVICE_URL=http://agent-service:4001
    depends_on:
      - db
      - rag-service
      - agent-service
    volumes:
      - ./Server/user_service/src:/app/src
      - ./Server/user_service/prisma:/app/prisma

  agent-service:
    build:
      context: ./Server/Agent_backend_service
      dockerfile: Dockerfile
    container_name: MedGPT_agent_service
    ports:
      - "4001:4001"
    env_file:
      - ./Server/Agent_backend_service/.env
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://postgres:Saha%4006122004@db:5432/MedGPT_DB
      - RAG_SERVICE_URL=http://rag-service:8000
    depends_on:
      - db
      - rag-service
    volumes:
      - ./Server/Agent_backend_service/src:/app/src

  rag-service:
    build:
      context: ./Server/RAG_Service
      dockerfile: Dockerfile
    container_name: MedGPT_rag
    ports:
      - "8000:8000"
    env_file:
      - ./Server/RAG_Service/.env
    volumes:
      - ./Server/RAG_Service:/app

  db:
    image: postgres:15-alpine
    container_name: MedGPT_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Saha@06122004
      POSTGRES_DB: MedGPT_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
