services:
  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:?Set the public frontend origin}
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      - user-service
    # existing build, expose, etc.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: ./Server/user_service
      dockerfile: Dockerfile
      target: build            # the stage that still has dev deps and the Prisma CLI
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medgpt}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-MedGPT_DB}
      RUN_SEED: ${RUN_SEED:-false}
    command:
      - sh
      - -c
      - npm run migrate:deploy && if [ "$$RUN_SEED" = "true" ]; then npm run seed; fi
    depends_on:
      db:
        condition: service_healthy

  user-service:
    build:
      context: ./Server/user_service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      USER_SERVICE_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-medgpt}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-MedGPT_DB}
      RAG_SERVICE_URL: http://rag-service:8000
      AGENT_SERVICE_URL: http://agent-service:4000
      AGENT_SERVICE_API_KEY: ${AGENT_SERVICE_API_KEY:?}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      OCR_PROVIDER: ${OCR_PROVIDER:-groq}
      GROQ_OCR_API_KEY: ${GROQ_OCR_API_KEY:?}
      # If you switch OCR providers, add GEMINI_OCR_API_KEY or OPENAI_OCR_API_KEY (and OPENAI_API_URL) here
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-service:
        condition: service_started
      agent-service:
        condition: service_started
    # existing build, expose, environment, etc.
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agent-service:
    build:
      context: ./Server/Agent_backend_service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      AGENT_SERVICE_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-medgpt}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-MedGPT_DB}
      RAG_SERVICE_URL: http://rag-service:8000
      AGENT_SERVICE_API_KEY: ${AGENT_SERVICE_API_KEY:?}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?}
      AGENT_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS:?}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-groq}
      GROQ_AGENT_API_KEY: ${GROQ_AGENT_API_KEY:?}
      # If MODEL_PROVIDER=openai, use OPENAI_AGENT_API_KEY instead
      # Optional search: SERPAPI_KEY, or GOOGLE_SEARCH_API_KEY + GOOGLE_SEARCH_CX
    depends_on:
      migrate:
        condition: service_completed_successfully
      rag-service:
        condition: service_started
      # existing build, expose, environment, etc.
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  rag-service:
    build:
      context: ./Server/RAG_Service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PINECONE_API_KEY: ${PINECONE_API_KEY:?}
      GROQ_API_KEY: ${GROQ_API_KEY:?}
      BACKEND_ALLOWED_ORIGINS: http://user-service:3000,http://agent-service:4000
      # existing build, expose, environment, etc.
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-MedGPT_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: