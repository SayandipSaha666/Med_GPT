services:
  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - user-service
    networks:
      - medgpt-internal

  user-service:
    build:
      context: ./Server/user_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Server/user_service/.env
    environment:
      NODE_ENV: production
      USER_SERVICE_PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-medgpt}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:-MedGPT_DB}
      RAG_SERVICE_URL: http://rag-service:8000
      AGENT_SERVICE_URL: http://agent-service:4000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      rag-service:
        condition: service_started
      agent-service:
        condition: service_started
    networks:
      - medgpt-internal

  agent-service:
    build:
      context: ./Server/Agent_backend_service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Server/Agent_backend_service/.env
    environment:
      NODE_ENV: production
      AGENT_SERVICE_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-medgpt}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:-MedGPT_DB}
      RAG_SERVICE_URL: http://rag-service:8000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - medgpt-internal

  rag-service:
    build:
      context: ./Server/RAG_Service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Server/RAG_Service/.env
    ports:
      - "8000:8000"
    networks:
      - medgpt-internal
    # If the service downloads model files at runtime, consider adding a named
    # model-cache volume after confirming the cache path used by your code.

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: ${POSTGRES_DB:-MedGPT_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - medgpt-internal

volumes:
  postgres_data:

networks:
  medgpt-internal:
    driver: bridge
